<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Growth & Profile Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #ffffff;
      color: #1e293b;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(10, 102, 194, 0.25);
    }
    .title-box {
      flex: 1;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      background: #e6f4ea;
      color: #137333;
      margin-top: 2px;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .provider-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 12px;
      color: #0a66c2;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #0a66c2;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #004182;
      box-shadow: 0 2px 8px rgba(10, 102, 194, 0.3);
    }
    .btn-sec {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-sec:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .shortcuts-section {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
    }
    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-top: 6px;
    }
    .shortcut-row:first-child {
      margin-top: 4px;
    }
    .shortcut-name {
      color: #475569;
    }
    kbd {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 10px;
      font-weight: 600;
      color: #334155;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo" id="header-logo">
    <div class="title-box">
      <div class="title">LinkedIn Growth Agent</div>
      <span class="badge" id="status-badge">AI Assistant Ready</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Active AI Provider</div>
    <div class="provider-status">
      <span id="provider-name">Google Gemini</span>
      <span id="key-indicator" style="font-size: 11px; color: #137333;">● Key Configured</span>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="btn-toggle-panel">
      ✦ Open Assistant on LinkedIn
    </button>
    <button class="btn btn-sec" id="btn-humanize-draft">
      ⚡ Humanize Active Draft
    </button>
    <button class="btn btn-sec" id="btn-open-linkedin">
      🔗 Launch LinkedIn Feed
    </button>
  </div>

  <div class="shortcuts-section">
    <div class="card-label">Keyboard Shortcuts</div>
    <div class="shortcut-row">
      <span class="shortcut-name">Toggle Agent Panel</span>
      <kbd>Ctrl+Shift+X</kbd>
    </div>
    <div class="shortcut-row">
      <span class="shortcut-name">Humanize Composer Draft</span>
      <kbd>Ctrl+Shift+H</kbd>
    </div>
  </div>

  <div class="footer">
    v1.3.0 • BYOK AI Architecture
  </div>

  <script src="popup.js"></script>
</body>
</html>
